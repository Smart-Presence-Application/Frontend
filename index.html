<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fetch the body font with the CSS rather than after it; Vite rewrites the path to the hashed asset. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartPresence" />
    <title>SmartPresence | AI-Powered School Management and Attendance</title>
    <meta
      name="description"
      content="SmartPresence manages teachers, students, parents, attendance, notices and reports in one platform, with AI face recognition that takes classroom attendance from a single photo."
    />
    <meta
      name="keywords"
      content="AI attendance, face recognition attendance, school attendance system, smart attendance, teacher attendance, parent notifications, school management"
    />
    <meta name="robots" content="index, follow" />
    <!-- The canonical link and og:url are set per route by <Seo />, so they always match the page. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartPresence" />
    <meta property="og:title" content="SmartPresence | AI-Powered School Management and Attendance" />
    <meta
      property="og:description"
      content="Teachers, students, parents, attendance, notices and reports in one platform. Take classroom attendance from a single photo."
    />
    <!-- Link previews need a PNG/JPG; SVG is not shown by WhatsApp, LinkedIn, X or Facebook. -->
    <meta property="og:image" content="https://www.smartpresence.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SmartPresence: AI-powered school management and attendance" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartPresence | AI-Powered School Management and Attendance" />
    <meta
      name="twitter:description"
      content="Teachers, students, parents, attendance, notices and reports in one platform."
    />
    <meta name="twitter:image" content="https://www.smartpresence.tech/og-image.png" />

    <!-- Website identity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SmartPresence",
      "alternateName": "Smart Presence",
      "url": "https://www.smartpresence.tech/"
    }
    </script>

    <!-- Software application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SmartPresence",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "An AI-powered school management platform for teachers, students, parents, attendance, notices and reports, with face recognition attendance from a single classroom photo.",
      "url": "https://www.smartpresence.tech/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SmartPresence needs JavaScript enabled to run. It is an AI face recognition attendance platform for schools.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
